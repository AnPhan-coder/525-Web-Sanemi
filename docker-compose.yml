services:
  mysqldb:
    image: mysql:8.0
    container_name: sanemi_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: defaultdb
    ports:
      - "3306:3306"
    volumes:
      - sanemi_db_data:/var/lib/mysql
      - ./sanemi.sql:/docker-entrypoint-initdb.d/sanemi.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  sanemi_db_data:
